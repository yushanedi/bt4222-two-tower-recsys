# Full-scale configuration (GPU machine). Any key can be overridden on the command line, e.g.
#   python scripts/03_train_tower.py --config configs/default.yaml --set tower.epochs=2 --set device=cuda
# Relative paths are resolved against the repository root.

paths:
  raw_dir: data/raw          # must contain user_behavior_data.txt and product_meta_data.txt
  work_dir: outputs          # everything produced by the pipeline goes under <work_dir>/<scope>/

scope: full                  # "full" or "sample_<N>" (e.g. sample_30000): a user subsample cut from the full data
seed: 42
device: auto                 # auto | cuda | mps | cpu

prepare:
  split: {train: 0.8, val: 0.1, test: 0.1}
  n_folds: 5                 # cross-fitting folds over training users (out-of-fold tower scores and CTR encoding)
                             # 5 folds: train OOF features use 80% of users vs 50% with 2 folds, closer to the
                             # all-training tables that validation/test users see

# JDsearch history is three logs with different retention windows, counted back from each user's test query.
# Every history feature is computed per event type inside that type's own window.
windows:
  click: 7
  follow: 90
  cart: 90
  order: 365
  short: 7                   # history segments used by the tower: [0, short) days, [short, mid) days, [mid, inf) days
  mid: 90

features:
  chunk_users: 20000         # users per feature chunk (bounds memory)
  ctr_prior: 50              # Bayesian shrinkage of impression CTR towards the global rate (was 20: rare
                             # item-level CTR keys were noisy and gave the ranker an easy way to memorise)
  bm25: {k1: 1.2, b: 0.75, idf_docs: 1000000}
  query_history_jaccard: 0.5

tower:
  d: 128                     # output dimension of both towers
  d_term: 32                 # shared term embedding (queries and item text)
  d_id: 32                   # brand / shop / category id embeddings
  d_pop: 16                  # unused: popularity is now an explicit offset, not an embedding
  query_len: 8
  seg_len: {short: 50, mid: 30, long: 30}   # most recent events kept per history segment
  min_term_count: 20         # a term must appear this often to earn its own embedding row
  max_terms: 50000           # ~50k frequent words instead of 400k near-singletons
  oov_buckets: 20000
  term_count_docs: 2000000   # products sampled to count term frequencies for the vocabulary
  slate_batch: 64            # users (slates) per listwise step
  max_slate: 200
  epochs: 2                  # 3 epochs was 2.4 passes past the val optimum
  lr: 0.001
  weight_decay: 1.0e-4
  dropout: 0.15              # in both tower MLPs
  word_dropout: 0.15         # hide this share of an item's title terms in training (candidates and history alike)
  eval_per_epoch: 2          # validate twice per epoch so the best checkpoint is not missed
  grad_clip: 5.0
  aux:                       # auxiliary in-batch softmax on historical (query -> item) pairs
    enabled: true
    max_age_days: 7          # only anchors inside the click window, where the history before them is complete
    batch: 1024
    weight: 0.5
    every: 2                 # one auxiliary step every N listwise steps
    hard_negatives: 8        # slate items the user passed over, added to the in-batch negatives
  amp: true
  item_matrix_on_gpu: true   # ~2 GB int32 on the GPU for the full catalogue; set false on small GPUs
  eval_batch_users: 512
  log_every: 200

ranker:
  num_boost_round: 3000
  early_stopping_rounds: 100
  label_gain: [0, 1, 3, 7]   # graded gain 2^label - 1 for labels 0..3
  train_user_frac: 1.0       # subsample training users for faster experiments
  train_eval_user_frac: 0.25 # share of training users scored to report training performance
  params:
    objective: lambdarank
    metric: ndcg
    eval_at: [1, 10]
    learning_rate: 0.03
    # regularisation against overfitting the training slates: shallow trees, large leaves, feature and row
    # subsampling, L2 on leaf values, and path_smooth to pull small leaves towards their parent
    num_leaves: 31
    min_data_in_leaf: 1000
    max_depth: 7
    feature_fraction: 0.5
    bagging_fraction: 0.7
    bagging_freq: 1
    lambda_l2: 5.0
    path_smooth: 10.0
    lambdarank_truncation_level: 30
    num_threads: 0
    verbose: -1

baselines:
  ensemble_grid: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0]   # weight of BM25 percentile vs popularity, picked on validation

prior_ncf:                   # previous team's Hybrid NCF + LSTM, re-implemented as a reference (scripts/02c_prior_ncf.py)
  variants: [fixed, published]
  epochs: 3
  batch_users: 256
  neg_per_pos: 4
  maxlen: 200
  min_item_count: 3
  d: 64
  hidden: 128
  lr: 0.001

eda:
  sample_users: 30000        # users for the text-join analyses (signal AUC, lexical overlap)

diagnostics:
  shap_rows: 50000
  ablation_user_frac: 0.3    # share of training users used to retrain ablated rankers
  attention_users: 4096
